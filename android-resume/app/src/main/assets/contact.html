<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Contact Herald Felisilda">
  <title>Contact | Herald Felisilda</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="contact">
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top backdrop-blur border-bottom border-slate-800">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="index.html">HFolio</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-lg-2">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="experience.html">Experience</a></li>
          <li class="nav-item"><a class="nav-link" href="portfolio.html">Portfolio</a></li>
          <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="mb-4">
      <h1 class="display-6 fw-bold mb-2">Let’s Build Something</h1>
      <p class="text-slate-400 mb-0">Open for software consulting, architecture, and full-stack development projects.</p>
    </div>
    <div class="row g-4">
      <div class="col-12 col-lg-5">
        <div class="glass rounded-4 p-4 h-100">
          <h2 class="h5 mb-3">Direct Contact</h2>
          <div id="contactLinks" class="d-flex flex-column gap-2"></div>
        </div>
      </div>
      <div class="col-12 col-lg-7">
        <div class="glass rounded-4 p-4">
          <h2 class="h5 mb-3">Quick Message</h2>
          <form id="contactForm" class="row g-3">
            <div class="col-12 col-md-6">
              <label for="fullName" class="form-label">Full Name</label>
              <input id="fullName" type="text" class="form-control" required>
            </div>
            <div class="col-12 col-md-6">
              <label for="emailAddress" class="form-label">Email</label>
              <input id="emailAddress" type="email" class="form-control" required>
            </div>
            <div class="col-12">
              <label for="message" class="form-label">Message</label>
              <textarea id="message" class="form-control" rows="4" required></textarea>
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-info">Send Message</button>
            </div>
          </form>
          <div id="formStatus" class="mt-3 small text-info-emphasis d-none"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-4 border-top border-slate-800">
    <div class="container text-slate-400 text-sm">
      <span id="footerName"></span>
    </div>
  </footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
